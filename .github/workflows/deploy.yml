name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC + checkout
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Build & deploy frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync dist/assets/ "s3://${{ vars.S3_BUCKET }}/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (no cache)
        run: |
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Upload other root files
        run: |
          for f in dist/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            case "$name" in
              index.html) ;;
              *) aws s3 cp "$f" "s3://${{ vars.S3_BUCKET }}/$name" ;;
            esac
          done

      - name: Invalidate CloudFront (frontend)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_FRONTEND_ID }}" \
            --paths "/index.html" "/"

  backend:
    name: Deploy backend (SSH to EC2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/AtharvAyur
          git fetch --all --prune
          git reset --hard origin/main
          cd backend
          docker compose -f docker-compose.aws.yml up -d --build
          echo "Waiting for API to become healthy..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/openapi.json > /dev/null 2>&1; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose -f docker-compose.aws.yml logs --tail=100 api
          exit 1
          REMOTE
