# AWS single-EC2 style: Postgres (pgvector) + API on one host.
#
# Expects a populated backend/.env on the host. At minimum set:
#   HOLISTICA_DB_PASSWORD, JWT_SECRET_KEY, LLM_PROVIDER, GROQ_API_KEY (or GEMINI_API_KEY),
#   CORS_ORIGINS, WEBAUTHN_RP_ID, WEBAUTHN_RP_NAME, WEBAUTHN_ORIGIN, OPENWEATHER_API_KEY
#
# Usage on server (from backend/):
#   docker compose -f docker-compose.aws.yml up -d --build
#
# DATABASE_URL is injected here (not via .env) because it must reference the
# Docker service name `db` on the internal network.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: holistica
      POSTGRES_PASSWORD: ${HOLISTICA_DB_PASSWORD:-holistica}
      POSTGRES_DB: holistica_health
    volumes:
      - holistica_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holistica -d holistica_health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL so it points at the Docker service, not localhost.
      DATABASE_URL: postgresql+psycopg2://holistica:${HOLISTICA_DB_PASSWORD:-holistica}@db:5432/holistica_health
    depends_on:
      db:
        condition: service_healthy

volumes:
  holistica_pgdata:
