# AWS single-EC2 style: Postgres (pgvector) + API on one host.
# Usage on server (from backend/):
#   export HOLISTICA_DB_PASSWORD='choose-a-strong-password'
#   export GEMINI_API_KEY='...'
#   export OPENWEATHER_API_KEY='...'   # optional
#   export CORS_ORIGINS='https://YOUR_CLOUDFRONT_OR_S3_WEBSITE_URL'
#   docker compose -f docker-compose.aws.yml up -d --build
#
# DATABASE_URL uses the Docker service name `db` (internal network).

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: holistica
      POSTGRES_PASSWORD: ${HOLISTICA_DB_PASSWORD:-holistica}
      POSTGRES_DB: holistica_health
    volumes:
      - holistica_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holistica -d holistica_health"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://holistica:${HOLISTICA_DB_PASSWORD:-holistica}@db:5432/holistica_health
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

volumes:
  holistica_pgdata:
